<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/images/favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="stylesheet" href="/dist/styles.css" />
    <title>Dine Restaurant</title>
  </head>
  <body>
    <header class="header wrapper">
      <a href="/">
        <img
          class="logo"
          src="/images/logo.svg"
          alt="Dine"
          width="103"
          height="40"
        />
      </a>
    </header>
    <main>
      <section class="hero wrapper">
        <picture class="hero__image fullbleed">
          <source
            media="(width>= 68.75em)"
            srcset="/images/homepage/hero-bg-desktop@2x.jpg"
            width="2880"
            height="1640"
          />
          <source
            media="(width>= 43.75em)"
            srcset="/images/homepage/hero-bg-tablet@2x.jpg"
            width="1536"
            height="1984"
          />
          <img
            src="/images/homepage/hero-bg-mobile@2x.jpg"
            alt="plate with shrimp scampi spaghetti"
            width="750"
            height="1496"
          />
        </picture>
        <h1 class="hero__title">Exquisite dining since 1989</h1>
        <p class="hero__description">
          Experience our seasonal menu in beautiful country surroundings. Eat
          the freshest produce from the comfort of our farmhouse.
        </p>
        <a href="/booking.html" class="hero__button button">Book a table</a>
      </section>
    </main>
  </body>
</html>
